[workspace]
resolver = "2"
members = [
    "crates/exo-core",
    "crates/exo-physics",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Alex Acuna Viera <kyuumeitai@gmail.com>"]
license = "MIT"

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "26.0"
winit = "0.30"
pollster = "0.4"
cpal = "0.15"
png = "0.18"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
