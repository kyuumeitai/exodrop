plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kyuumeitai.exodrop'
    compileSdk 36

    defaultConfig {
        applicationId "com.kyuumeitai.exodrop"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
